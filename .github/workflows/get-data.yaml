name: Update 3-day snow forecast and accumulation

on:
  schedule:
    - cron: "10 12 * * *"  # 7:10 AM EST / 8:10 AM EDT
  workflow_dispatch:

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/get-*.R') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libgdal-dev libproj-dev libgeos-dev gdal-bin python3-gdal

      - name: Install R packages
        run: |
          Rscript -e 'if (!require("httr")) install.packages("httr", repos="https://cloud.r-project.org")'
          Rscript -e 'if (!require("terra")) install.packages("terra", repos="https://cloud.r-project.org")'
          Rscript -e 'if (!require("jsonlite")) install.packages("jsonlite", repos="https://cloud.r-project.org")'

      - name: Create tile directories
        run: |
          mkdir -p tiles/accumulation
          mkdir -p tiles/forecast

      - name: Run forecast script
        run: Rscript get-forecast.R

      - name: Run accumulation script
        run: Rscript get-accumulation.R

      - name: Generate tiles for accumulation
        run: |
          gdal2tiles.py -z 4-9 --processes=$(nproc) -r near snowfall_72hr.tif tiles/accumulation/

      - name: Generate tiles for forecast
        run: |
          gdal2tiles.py -z 4-9 --processes=$(nproc) -r near snowfall_forecast_72hr.tif tiles/forecast/

      - name: Commit and push tiles if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add tiles/
          git diff --cached --quiet || git commit -m "Auto update accumulation and forecast tiles"
          git push