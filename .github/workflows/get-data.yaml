name: Update 3-day snow forecast and accumulation

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libgdal-dev libproj-dev libgeos-dev gdal-bin python3-gdal

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("httr", "terra", "jsonlite"), repos="https://cloud.r-project.org")'

      - name: Run forecast script
        run: Rscript get-forecast.R

      - name: Run accumulation script
        run: Rscript get-accumulation.R

      - name: Convert GeoTIFF to 8-bit RGB (if needed)
        run: |
          gdal_translate -ot Byte -scale 0 40 0 255 -of GTiff snowfall_72hr.tif snowfall_72hr_byte.tif

      - name: Generate tiles
        run: |
          mkdir -p tiles
          gdal2tiles.py -z 4-9 --processes=4 snowfall_72hr_byte.tif tiles/

      - name: Commit and push tiles if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions"
          git add tiles/
          git diff --cached --quiet || git commit -m "Auto update forecast tiles + timestamp"
          git push