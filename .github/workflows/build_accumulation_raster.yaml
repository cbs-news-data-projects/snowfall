name: Build 72hr accumulation files

on:
  schedule:
    - cron: "0 13 * * *"  # daily at 13 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v3

      # Install system dependencies
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            python3-gdal

      # Setup R
      - uses: r-lib/actions/setup-r@v2

      # Install required R packages
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("terra","httr","lubridate","sf"), repos="https://cloud.r-project.org/")'
          
      # Run the R pipeline to download + reproject TIFF
      - name: Build snowfall raster
        run: |
          Rscript get-data_accumulation.R

      # Scale and convert to 8-bit VRT for tiles
      - name: Scale raster and create VRT
        run: |
          # Use latest 3857 raster
          FILE=$(ls data/*_3857.tif | sort | tail -n1)
          echo "Scaling $FILE to 0-254 and writing VRT..."
          gdal_translate \
            -of VRT \
            -ot Byte \
            -a_nodata 255 \
            -scale 0 100 0 254 \
            "$FILE" \
            data/temp.vrt

      # Generate tiles with gdal2tiles
      - name: Generate tiles
        run: |
          mkdir -p tiles_output
          gdal2tiles.py \
            -z 0-8 \
            -r bilinear \
            data/temp.vrt \
            tiles_output

      - name: Deploy tiles to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tiles_output
          publish_branch: gh-pages
          allow_empty_commit: true
          destination_dir: tiles_output
          
