name: Build Snowfall MBTiles

on:
  workflow_dispatch:   # allows manual trigger
  schedule:
    - cron: '0 13 * * *' # run daily at 12 UTC + 1 hour buffer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          sudo apt update
          sudo apt install -y gdal-bin

      - name: Download snowfall TIFF
        run: |
          TODAY=$(date +%Y%m%d)
          YEAR_MONTH=$(date +%Y%m)
          mkdir -p tileserver
          URL="https://www.nohrsc.noaa.gov/snowfall/data/${YEAR_MONTH}/sfav2_CONUS_72h_${TODAY}12.tif"
          echo "Downloading $URL"
          wget -O tileserver/snow_${TODAY}.tif "$URL"

      - name: Reproject to Web Mercator
        run: |
          TODAY=$(date +%Y%m%d)
          gdalwarp -t_srs EPSG:3857 \
            tileserver/snow_${TODAY}.tif \
            tileserver/snow_${TODAY}_3857.tif

      - name: Convert to MBTiles
        run: |
          TODAY=$(date +%Y%m%d)
          gdal_translate -of MBTILES \
            tileserver/snow_${TODAY}_3857.tif \
            tileserver/snow_${TODAY}.mbtiles

      - name: Commit MBTiles
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tileserver/*.mbtiles
          git commit -m "Update snow ${TODAY}" || echo "No changes"
          git push